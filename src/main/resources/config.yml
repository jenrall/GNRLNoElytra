settings:
  # جلوگیری از پوشیدن الایترا (ولی اگه در حال گلاید باشه، بذار)
  prevent-equip: true

  # جلوگیری از گلاید کردن
  # اگه true باشه، اصلاً نمی‌تونه گلاید کنه
  # اگه false باشه، می‌تونه یه بار گلاید کنه ولی بعدش الایترا حذف می‌شه
  prevent-glide: false

  # حذف الایترا از اینونتوری
  remove-from-inventory: true

  # حذف الایتراهای دراپ شده روی زمین
  remove-dropped: true

  messages:
    equip-denied: "<red>✖ نمی‌تونی الایترا بپوشی!</red>"
    glide-denied: "<red>✖ نمی‌تونی از الایترا استفاده کنی!</red>"
    elytra-removed: "<red>✖ الایترا از اینونتوریت حذف شد!</red>"
